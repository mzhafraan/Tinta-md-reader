name: Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggered on tags like v1.0.0, v1.0.1
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Release & Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare & Sign Release Artifacts
        id: prepare_artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          echo "CURRENT_TAG=$TAG_NAME" >> $GITHUB_ENV
          
          mkdir -p release_assets
          
          # Check if an unsigned release apk exists, sign it with Android debug key or apksigner if no custom keystore
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          # Copy debug apk as ready-to-install companion
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release_assets/Tinta-${TAG_NAME}-debug.apk"
          fi
          
          # If release APK is unsigned, generate a release key and sign it so users can install it immediately
          if [ -f "$RELEASE_APK" ]; then
            if [[ "$RELEASE_APK" == *"unsigned"* ]]; then
              echo "Signing release APK with self-signed certificate for direct installation..."
              keytool -genkey -v -keystore release.keystore -alias tinta -keyalg RSA -keysize 2048 -validity 10000 -storepass tintapass -keypass tintapass -dname "CN=Tinta, OU=Zeeonworks, O=OpenSource, L=Bandung, ST=WestJava, C=ID"
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass tintapass "$RELEASE_APK" tinta
            fi
            cp "$RELEASE_APK" "release_assets/Tinta-${TAG_NAME}.apk"
          fi
          
          ls -lh release_assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CURRENT_TAG }}
          name: "Tinta ${{ env.CURRENT_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.apk
